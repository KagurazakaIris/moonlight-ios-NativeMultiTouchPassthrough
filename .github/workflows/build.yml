name: Build and Sign IPAs

on:
  push:
    branches: [ "noWaterMark" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign iOS IPAs
    runs-on: macos-latest
    if: github.ref == 'refs/heads/noWaterMark'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Checkout Submodules
        run: git submodule update --init --recursive

      - name: Setup Code Signing
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision

          echo "${{ secrets.IOS_P12_BASE64 }}" | base64 --decode > "$CERT_PATH"
          echo "${{ secrets.IOS_PROVISION_BASE64 }}" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$CERT_PATH" -P "${{ secrets.IOS_P12_PASSWORD }}" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      - name: Set Bundle Identifier to match Provisioning Profile
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*;/PRODUCT_BUNDLE_IDENTIFIER = com.seele.moonlight;/' Moonlight.xcodeproj/project.pbxproj
      - name: Patch Code Signing in pbxproj
        run: |
          TEAM_ID="ZNVDEVDRX3"
          PROFILE_NAME="${{ secrets.PROFILE_NAME }}"
          sed -i '' "s/DevelopmentTeam = .*;/DevelopmentTeam = $TEAM_ID;/g" Moonlight.xcodeproj/project.pbxproj
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = $TEAM_ID;/g" Moonlight.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" Moonlight.xcodeproj/project.pbxproj
          # 如果之前有绑定 UUID 的描述文件，建议移除
          sed -i '' "/PROVISIONING_PROFILE = /d" Moonlight.xcodeproj/project.pbxproj

      - name: Build and Sign FullScreen Version
        run: |
          plutil -replace UIRequiresFullScreen -bool true Limelight/Limelight-Info.plist
          xcodebuild -scheme Moonlight-ZWM -sdk iphoneos -configuration AppStoreDistribution \
            -archivePath $PWD/build/MoonlightFullScreen.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROFILE_NAME }}"

          mkdir -p build/IPA_FullScreen/Payload
          cp -r build/MoonlightFullScreen.xcarchive/Products/Applications/Moonlight-ZWM.app build/IPA_FullScreen/Payload/
          codesign -f -s "${{ secrets.CODE_SIGN_IDENTITY }}" --timestamp=none build/IPA_FullScreen/Payload/Moonlight-ZWM.app
          cd build/IPA_FullScreen && zip -r ../Moonlight-ZWM_FullScreen.ipa Payload && cd ../..

      - name: Upload FullScreen IPA to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-ZWM_FullScreen.ipa
          path: build/Moonlight-ZWM_FullScreen.ipa

      - name: Build and Sign StageManager Version
        run: |
          plutil -replace UIRequiresFullScreen -bool false Limelight/Limelight-Info.plist
          xcodebuild -scheme Moonlight-ZWM -sdk iphoneos -configuration AppStoreDistribution \
            -archivePath $PWD/build/MoonlightStageManager.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ secrets.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROFILE_NAME }}"

          mkdir -p build/IPA_StageManager/Payload
          cp -r build/MoonlightStageManager.xcarchive/Products/Applications/Moonlight-ZWM.app build/IPA_StageManager/Payload/
          codesign -f -s "${{ secrets.CODE_SIGN_IDENTITY }}" --timestamp=none build/IPA_StageManager/Payload/Moonlight-ZWM.app
          cd build/IPA_StageManager && zip -r ../Moonlight-ZWM_StageManager.ipa Payload && cd ../..

      - name: Upload StageManager IPA to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-ZWM_StageManager.ipa
          path: build/Moonlight-ZWM_StageManager.ipa

      - name: Set Release Version (Beijing Time)
        id: version
        run: |
          version="v$(python3 -c "from datetime import datetime, timedelta; print((datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%dT%H-%M-%S'))")"
          echo "RELEASE_VERSION=$version" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: |
            build/Moonlight-ZWM_FullScreen.ipa
            build/Moonlight-ZWM_StageManager.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
