name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Keychain & Certificates
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$IOS_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "build" ios-build.keychain
          security default-keychain -s ios-build.keychain
          security unlock-keychain -p "build" ios-build.keychain
          security import certificate.p12 -k ios-build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "build" ios-build.keychain

      - name: Install Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISION_BASE64" | base64 --decode > profile.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(/usr/bin/security cms -D -i profile.mobileprovision))
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Patch pbxproj with correct signing info
        run: |
          sed -i '' 's/DevelopmentTeam = .*;/DevelopmentTeam = ZNVDEVDRX3;/g' Moonlight.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = ZNVDEVDRX3;/g' Moonlight.xcodeproj/project.pbxproj
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = "Moonlight iOS App Store";/g' Moonlight.xcodeproj/project.pbxproj
          sed -i '' '/PROVISIONING_PROFILE = /d' Moonlight.xcodeproj/project.pbxproj

      - name: Build and Archive App
        run: |
          plutil -replace UIRequiresFullScreen -bool true Limelight/Limelight-Info.plist

          xcodebuild clean archive \
            -workspace Moonlight.xcworkspace \
            -scheme Moonlight-ZWM \
            -configuration AppStoreDistribution \
            -sdk iphoneos \
            -archivePath build/MoonlightFullScreen.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Moonlight iOS App Store" \
            DEVELOPMENT_TEAM=ZNVDEVDRX3

      - name: Export IPA
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>ZNVDEVDRX3</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.seele.moonlight</key>
              <string>Moonlight iOS App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/MoonlightFullScreen.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/exported_ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-iOS-FullScreen
          path: build/exported_ipa/*.ipa

      - name: Upload StageManager IPA to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-ZWM_StageManager.ipa
          path: build/Moonlight-ZWM_StageManager.ipa

      - name: Set Release Version (Beijing Time)
        id: version
        run: |
          version="v$(python3 -c "from datetime import datetime, timedelta; print((datetime.utcnow() + timedelta(hours=8)).strftime('%Y-%m-%dT%H-%M-%S'))")"
          echo "RELEASE_VERSION=$version" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: |
            build/Moonlight-ZWM_FullScreen.ipa
            build/Moonlight-ZWM_StageManager.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
